spring:
  application:
    name: weekly-planner-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/weekly_planner}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-chars}
  expiration: 86400000  # 24시간

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
